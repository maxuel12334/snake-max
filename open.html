    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

      .box {

      }
      h1 { margin: 0 0 10px; font-size: 2rem; }
      p { color: #b8d6f4; line-height: 1.6; }
      .btn {
        display: inline-block;
        margin-top: 14px;
        padding: 12px 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, #24e8b3, #44b8ff);
        color: #04111d;
        text-decoration: none;
        font-weight: 700;
      }
      .creator { margin-top: 10px; font-weight: 700; color: #7fe8ff; }

  <body>
    <div class="box">
      <h1>🐍 Snake Max</h1>

      <p>Criação e direção: <span class="creator">@Maxuel</span></p>
